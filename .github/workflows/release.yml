name: Release

# Publishes build artifacts when a version tag (v*) is pushed, each for
# linux/amd64 and linux/arm64:
#   - a Debian .deb package (built natively on Debian 12)
#   - a RHEL .rpm package (built on AlmaLinux 8 / glibc 2.28, so it runs on
#     RHEL/Alma/Rocky 8 and 9)
#   - two multi-arch container images pushed to GitHub Container Registry
#     (GHCR), both built by copying the Debian-built glibc binaries in (no
#     in-image compilation): a debian-slim image (:latest, :<version>) and a
#     distroless image (:distroless, :<version>-distroless)
#   - the Helm chart, pushed as an OCI artifact to
#     oci://ghcr.io/<owner>/charts/dbt-temporal at the same version
#
# The images are pushed under their exact version only. The chart e2e
# (chart-e2e.yml: the chart on k3d running a dbt project) then tests them, and
# only when it passes do the moving tags (:latest, :<major.minor>,
# :distroless) move, the chart get published and the GitHub release get
# created. A release that fails it leaves nothing pointing at its images.
#
# Every package and image carries LICENSE and THIRD-PARTY-LICENSES.txt, the
# license texts of all crates compiled in, generated once by the `licenses`
# job: distributing the binary is distributing those crates.
#
# Each distro package is built inside that distro's own container, on a runner
# of the target architecture, so the binary links against a matching glibc and
# nothing is cross-compiled. The container images reuse the Debian binaries
# rather than compiling again. A crates.io publish is intentionally absent: the
# crate depends on dbt v2's unpublished crates via git and on a
# `[patch.crates-io]` block for forked arrow-rs/ring, both of which
# `cargo publish` rejects. Build from source with
# `cargo install --git https://github.com/thejens/dbt-temporal` instead.
on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  PROTOC_VERSION: "25.1"

jobs:
  # One bundle serves every platform: about.toml scopes it to both release
  # targets, so it covers each binary's dependency graph.
  licenses:
    name: Third-party licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3

      - name: Generate
        run: make licenses

      - uses: actions/upload-artifact@v7
        with:
          name: third-party-licenses
          path: target/licenses/THIRD-PARTY-LICENSES.txt
          if-no-files-found: error

  deb:
    name: Debian package (.deb) + binary, ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          # `platform` is Docker's TARGETARCH naming; `protoc` is protobuf's
          # release-asset naming for the same architecture.
          - platform: amd64
            runner: ubuntu-latest
            protoc: x86_64
          - platform: arm64
            runner: ubuntu-24.04-arm
            protoc: aarch_64
    runs-on: ${{ matrix.runner }}
    needs: [licenses]
    container: debian:12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl unzip ca-certificates git \
            build-essential cmake perl pkg-config libssl-dev

      - name: Install protoc
        run: |
          curl -sSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-${{ matrix.protoc }}.zip"
          unzip -o /tmp/protoc.zip -d /usr/local

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The cloud stores are compile-time features. Distributed builds carry
      # both so that `gs://` / `s3://` work for ARTIFACT_STORE and
      # DBT_PROJECT_DIRS without users rebuilding from source.
      - name: Build
        run: cargo build --release --locked --features gcs,aws

      # Reused by the container job so the image isn't compiled a second time.
      # The artifact name carries the Docker platform the binary is for.
      - name: Upload binary for the container job
        uses: actions/upload-artifact@v7
        with:
          name: dbt-temporal-linux-${{ matrix.platform }}
          path: target/release/dbt-temporal

      - name: Download the license bundle
        uses: actions/download-artifact@v8
        with:
          name: third-party-licenses
          path: target/licenses

      - name: Package .deb
        run: |
          cargo install cargo-deb
          cargo deb --no-build

      - name: Upload .deb for the release job
        uses: actions/upload-artifact@v7
        with:
          name: package-deb-${{ matrix.platform }}
          path: target/debian/*.deb
          if-no-files-found: error

  rpm:
    name: RHEL package (.rpm), ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
            protoc: x86_64
          - platform: arm64
            runner: ubuntu-24.04-arm
            protoc: aarch_64
    runs-on: ${{ matrix.runner }}
    needs: [licenses]
    container: almalinux:8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps
        run: |
          dnf -y install \
            curl unzip git \
            gcc gcc-c++ make cmake perl-core openssl-devel pkgconfig

      - name: Install protoc
        run: |
          curl -sSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-${{ matrix.protoc }}.zip"
          unzip -o /tmp/protoc.zip -d /usr/local

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The cloud stores are compile-time features. Distributed builds carry
      # both so that `gs://` / `s3://` work for ARTIFACT_STORE and
      # DBT_PROJECT_DIRS without users rebuilding from source.
      - name: Build
        run: cargo build --release --locked --features gcs,aws

      - name: Download the license bundle
        uses: actions/download-artifact@v8
        with:
          name: third-party-licenses
          path: target/licenses

      - name: Package .rpm
        run: |
          cargo install cargo-generate-rpm
          cargo generate-rpm

      - name: Upload .rpm for the release job
        uses: actions/upload-artifact@v7
        with:
          name: package-rpm-${{ matrix.platform }}
          path: target/generate-rpm/*.rpm
          if-no-files-found: error

  # One job attaches every package. Parallel jobs each calling
  # action-gh-release can race to create the release and end up with two.
  # The packages carry the same binary the images do, so a release whose
  # images fail the e2e is not published at all.
  github-release:
    name: GitHub release (packages)
    runs-on: ubuntu-latest
    needs: [deb, rpm, chart-e2e]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Upload packages to release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true

  container:
    name: Container images (debian-slim + distroless)
    runs-on: ubuntu-latest
    needs: [deb]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Lands each binary at bin/dbt-temporal-linux-<platform>/dbt-temporal,
      # which the Dockerfiles pick by TARGETARCH.
      - name: Download the Debian-built binaries
        uses: actions/download-artifact@v8
        with:
          pattern: dbt-temporal-linux-*
          path: bin

      - name: Download the license bundle
        uses: actions/download-artifact@v8
        with:
          name: third-party-licenses
          path: target/licenses

      # The debian-slim image runs apt-get, so its arm64 stage needs emulation
      # on this amd64 runner. Only package installs run emulated; the binary is
      # already built.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Default image (debian-slim): :<version>, :<major.minor>, :latest
      - name: Metadata (debian-slim)
        id: meta_slim
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Only the exact version here: the moving tags follow in
          # promote-images, once the chart e2e has passed on this image.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push (debian-slim)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_slim.outputs.tags }}
          labels: ${{ steps.meta_slim.outputs.labels }}

      # Distroless variant: :<version>-distroless (the moving tags follow in
      # promote-images)
      - name: Metadata (distroless)
        id: meta_distroless
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=-distroless
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push (distroless)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.distroless
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_distroless.outputs.tags }}
          labels: ${{ steps.meta_distroless.outputs.labels }}

  # The chart, installed on k3d, running a dbt project against the images
  # just pushed. The images are on GHCR by now, but nothing points at them
  # yet: the chart and the GitHub release wait for this to pass.
  chart-e2e:
    name: Chart e2e
    needs: [container]
    permissions:
      contents: read
    uses: ./.github/workflows/chart-e2e.yml
    with:
      image-tag: ${{ github.ref_name }}

  # Points the moving tags at this release's images, now that they passed the
  # e2e: :<major.minor> and :latest for debian-slim, :<major.minor>-distroless
  # and :distroless for distroless. A copy of the existing multi-arch index,
  # nothing is rebuilt. Pre-releases keep only their exact version tag.
  promote-images:
    name: Promote images (moving tags)
    runs-on: ubuntu-latest
    needs: [chart-e2e]
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          minor="${version%.*}"
          docker buildx imagetools create -t "$IMAGE:$minor" -t "$IMAGE:latest" "$IMAGE:$version"
          docker buildx imagetools create -t "$IMAGE:$minor-distroless" -t "$IMAGE:distroless" "$IMAGE:$version-distroless"

  # After the images: the chart defaults to the image tagged with its own
  # appVersion, so it must never be published ahead of that image.
  chart:
    name: Helm chart (OCI on GHCR)
    runs-on: ubuntu-latest
    needs: [container, chart-e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Check the chart version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^version: \(.*\)$/\1/p' charts/dbt-temporal/Chart.yaml)
          app_version=$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' charts/dbt-temporal/Chart.yaml)
          if [ "$version" != "$tag" ] || [ "$app_version" != "$tag" ]; then
            echo "Chart.yaml has version $version / appVersion $app_version, tag is $tag" >&2
            exit 1
          fi

      - name: Package
        run: helm package charts/dbt-temporal --destination dist

      - name: Push to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push dist/dbt-temporal-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"
