[package]
name = "dbt-temporal"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "Execute dbt DAGs as Temporal Workflows"
repository = "https://github.com/thejens/dbt-temporal"

# Distro package metadata, consumed by the release workflow:
#   cargo-deb (Debian .deb) and cargo-generate-rpm (RHEL .rpm).
[package.metadata.deb]
maintainer = "thejens <jens.larsson56@gmail.com>"
section = "database"
priority = "optional"
depends = "$auto"
assets = [["target/release/dbt-temporal", "usr/bin/", "755"]]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/dbt-temporal", dest = "/usr/bin/dbt-temporal", mode = "0755" },
]

[[bin]]
name = "dbt-temporal"
path = "src/main.rs"

[lib]
name = "dbt_temporal"
path = "src/lib.rs"

[dependencies]
# Temporal SDK
# Core runtime/tuner types come through `temporalio_sdk::runtime`, so the worker
# needs no direct temporalio-sdk-core dependency (it stays a dev-dependency for
# the ephemeral test server).
temporalio-sdk = "1.0.0"
temporalio-client = "1.0.0"
# otel + prometheus enable the worker-metrics exporters in the telemetry module.
temporalio-common = { version = "1.0.0", features = ["otel", "prometheus"] }
temporalio-macros = "1.0.0"
# Runtime crate referenced by code the `#[workflow]`/`#[workflow_methods]` macros
# generate (their expansion names `::temporalio_workflow::*`).
temporalio-workflow = "1.0.0"

# dbt-fusion, now developed in the dbt-core repo as dbt Core v2 (pinned to main, 2026-09-06)
dbt-loader = { git = "https://github.com/dbt-labs/dbt-core", rev = "6f725fbec78cffb1e8086f111592589c60b543d5" }
# Private-package resolution, required by `dbt_loader::load`. The crate's lib
# name is `fs_deps`, so imports read `fs_deps::private_package::*`.
dbt-deps = { git = "https://github.com/dbt-labs/dbt-core", rev = "6f725fbec78cffb1e8086f111592589c60b543d5" }
dbt-parser = { git = "https://github.com/dbt-labs/dbt-core", rev = "6f725fbec78cffb1e8086f111592589c60b543d5" }
# The profiles.yml resolver dbt-loader itself uses. Needed directly so that
# per-workflow env-override rebuilds read a target the same way the startup
# load did, including the multi-adapter connection-list shape.
dbt-profile = { git = "https://github.com/dbt-labs/dbt-core", rev = "6f725fbec78cffb1e8086f111592589c60b543d5" }
dbt-schemas = { git = "https://github.com/dbt-labs/dbt-core", rev = "6f725fbec78cffb1e8086f111592589c60b543d5" }
dbt-jinja-utils = { git = "https://github.com/dbt-labs/dbt-core", rev = "6f725fbec78cffb1e8086f111592589c60b543d5" }
dbt-adapter = { git = "https://github.com/dbt-labs/dbt-core", rev = "6f725fbec78cffb1e8086f111592589c60b543d5" }
dbt-common = { git = "https://github.com/dbt-labs/dbt-core", rev = "6f725fbec78cffb1e8086f111592589c60b543d5" }
dbt-telemetry = { git = "https://github.com/dbt-labs/dbt-core", rev = "6f725fbec78cffb1e8086f111592589c60b543d5" }
# FsError/ErrorCode: dbt's own transient/permanent error taxonomy. Some Jinja
# adapter functions (e.g. run_query) wrap the underlying AdapterError in an
# FsError, discarding it as a downcastable source but keeping its ErrorCode —
# the retry classifier reads that field directly for those paths.
dbt-error = { git = "https://github.com/dbt-labs/dbt-core", rev = "6f725fbec78cffb1e8086f111592589c60b543d5" }
# Telemetry span-attribute types (TelemetryAttributes) live here; the compat
# layer inserts a default so dbt-fusion's adapter code doesn't panic.
dbt-tracing = { git = "https://github.com/dbt-labs/dbt-core", rev = "6f725fbec78cffb1e8086f111592589c60b543d5" }
dbt-auth = { git = "https://github.com/dbt-labs/dbt-core", rev = "6f725fbec78cffb1e8086f111592589c60b543d5" }
dbt-adbc = { git = "https://github.com/dbt-labs/dbt-core", rev = "6f725fbec78cffb1e8086f111592589c60b543d5" }
dbt-agate = { git = "https://github.com/dbt-labs/dbt-core", rev = "6f725fbec78cffb1e8086f111592589c60b543d5" }
dbt-csv = { git = "https://github.com/dbt-labs/dbt-core", rev = "6f725fbec78cffb1e8086f111592589c60b543d5" }
# Project checks query the project's own metadata, never the warehouse, so the
# worker has to reproduce the two artifacts dbt puts between a resolved project
# and its check gate. `dbt-metadata` serialises the resolved state into parse
# epochs; `dbt-index-core` ingests those into the index parquet and owns the
# parse-safe `dbt.*` view definitions. Both are leaf data crates, and the views
# are a shared contract: `info_schema()` — already in the tree via
# dbt-jinja-utils — renders check SQL against exactly those names, so a
# hand-rolled equivalent would diverge silently rather than fail to compile.
dbt-metadata = { git = "https://github.com/dbt-labs/dbt-core", rev = "6f725fbec78cffb1e8086f111592589c60b543d5" }
dbt-index-core = { git = "https://github.com/dbt-labs/dbt-core", rev = "6f725fbec78cffb1e8086f111592589c60b543d5" }
minijinja = { git = "https://github.com/dbt-labs/dbt-core", rev = "6f725fbec78cffb1e8086f111592589c60b543d5" }
dbt-yaml = "0.9.6"

# Standard
tokio = { version = "1", features = ["full"] }
futures = "0.3"
# Artifact payloads cross the store trait as `Bytes` so ownership travels
# instead of the bytes being copied at each hand-off.
bytes = "1"
# Required by code generated by temporalio's #[workflow] macro (uses ::futures_util::*).
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
filetime = "0.2"
# Selector value matching. dbt runs every selector value through this crate's
# `Pattern`, so what a selector matches is defined by it — using anything else,
# including a faithful reimplementation, is a divergence waiting to happen.
# Pinned to the same version dbt-core's workspace uses.
glob = "0.3.2"
arrow-select = "56"
# Unit test result comparison (patched to the sdf-labs fork like all arrow crates).
arrow-array = "56"
arrow-cast = "56"
arrow-schema = "56"
# CSV fixture parsing for dbt unit tests.
csv = "1"
tempfile = "3"
prost-types = { version = "0.7", package = "prost-wkt-types" }

# Artifact stores (feature-gated)
object_store = { version = "0.12", optional = true }
regex = "1.12.3"

dbt-antlr4 = "2"

[features]
default = []
gcs = ["object_store/gcp"]
aws = ["object_store/aws"]
bigquery-tests = []

[dev-dependencies]
testcontainers = { version = "0.27", features = ["watchdog"] }
testcontainers-modules = { version = "0.15", features = ["postgres", "minio"] }
aws-sdk-s3 = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
temporalio-sdk-core = { version = "0.9.0", features = ["ephemeral-server"] }
# Replay fixtures are stored gzipped: the continue-as-new history is 2.4MB raw,
# which both bloats the repo and trips the 500KB pre-commit size check.
flate2 = "1"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
unused_imports = "deny"
dead_code = "deny"
unreachable_code = "deny"
unreachable_patterns = "deny"
missing_debug_implementations = "deny"
unused_qualifications = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Allow pedantic lints that are pervasive and low-signal
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
doc_markdown = "allow"
# Restriction lints — prevent common mistakes
unwrap_used = "deny"
expect_used = "deny"
clone_on_ref_ptr = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
needless_pass_by_value = "deny"

# Patches required to match dbt-fusion's dependency versions.
# dbt-fusion uses forked arrow-rs and arrow-adbc.
# Without these patches, version conflicts prevent compilation.
[patch.crates-io]
# Forked arrow-rs (v56) used by dbt-fusion
arrow = { git = "https://github.com/sdf-labs/arrow-rs", rev = "e4924d7d6d07bb12ba6628e595f9f58c2c02c9a1" }
arrow-arith = { git = "https://github.com/sdf-labs/arrow-rs", rev = "e4924d7d6d07bb12ba6628e595f9f58c2c02c9a1" }
arrow-array = { git = "https://github.com/sdf-labs/arrow-rs", rev = "e4924d7d6d07bb12ba6628e595f9f58c2c02c9a1" }
arrow-buffer = { git = "https://github.com/sdf-labs/arrow-rs", rev = "e4924d7d6d07bb12ba6628e595f9f58c2c02c9a1" }
arrow-cast = { git = "https://github.com/sdf-labs/arrow-rs", rev = "e4924d7d6d07bb12ba6628e595f9f58c2c02c9a1" }
arrow-csv = { git = "https://github.com/sdf-labs/arrow-rs", rev = "e4924d7d6d07bb12ba6628e595f9f58c2c02c9a1" }
arrow-data = { git = "https://github.com/sdf-labs/arrow-rs", rev = "e4924d7d6d07bb12ba6628e595f9f58c2c02c9a1" }
arrow-ipc = { git = "https://github.com/sdf-labs/arrow-rs", rev = "e4924d7d6d07bb12ba6628e595f9f58c2c02c9a1" }
arrow-json = { git = "https://github.com/sdf-labs/arrow-rs", rev = "e4924d7d6d07bb12ba6628e595f9f58c2c02c9a1" }
arrow-ord = { git = "https://github.com/sdf-labs/arrow-rs", rev = "e4924d7d6d07bb12ba6628e595f9f58c2c02c9a1" }
arrow-row = { git = "https://github.com/sdf-labs/arrow-rs", rev = "e4924d7d6d07bb12ba6628e595f9f58c2c02c9a1" }
arrow-schema = { git = "https://github.com/sdf-labs/arrow-rs", rev = "e4924d7d6d07bb12ba6628e595f9f58c2c02c9a1" }
arrow-select = { git = "https://github.com/sdf-labs/arrow-rs", rev = "e4924d7d6d07bb12ba6628e595f9f58c2c02c9a1" }
arrow-string = { git = "https://github.com/sdf-labs/arrow-rs", rev = "e4924d7d6d07bb12ba6628e595f9f58c2c02c9a1" }

# ring build.rs workaround (same as dbt-fusion)
ring = { git = "https://github.com/sdf-labs/ring.git", rev = "3c35ce0b7e1bd9fe83180b19eda21d302e0b5006" }

# Forked datafusion (sdf/50) and sqlparser (sdf/0.58.0), re-introduced by dbt-fusion
# at the bb24b246 rev (previously on plain crates-io releases as of 37ba42bd).
# Only datafusion-common/datafusion-expr/sqlparser are actually pulled into our
# dependency graph — upstream's own patch table also lists the umbrella
# `datafusion` and `datafusion-catalog` crates, but cargo reports those two as
# unused patches here (we don't depend on them directly or transitively).
datafusion-common = { git = "https://github.com/sdf-labs/datafusion", rev = "c0627e28fdd64ad1e33e3e8f3d6515c7ecb886ed" }
datafusion-expr = { git = "https://github.com/sdf-labs/datafusion", rev = "c0627e28fdd64ad1e33e3e8f3d6515c7ecb886ed" }
sqlparser = { git = "https://github.com/sdf-labs/datafusion-sqlparser-rs", rev = "36843ce564b129a0e0a15b58997d8c132b7ce6d4" }
