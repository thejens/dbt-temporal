apiVersion: v2
name: dbt-temporal
description: Run dbt projects as durable Temporal workflows on Kubernetes — the dbt-temporal worker, with KEDA autoscaling, Prometheus metrics and graceful shutdown.
type: application
# Chart and app are released together from one tag, so the two versions move
# in lockstep; the Release workflow refuses a tag that disagrees with either.
version: 0.7.3
appVersion: "0.7.3"
kubeVersion: ">=1.25.0-0"
home: https://github.com/thejens/dbt-temporal
sources:
  - https://github.com/thejens/dbt-temporal
keywords:
  - dbt
  - temporal
  - data
  - orchestration
  - data-pipeline
  - etl
  - elt
  - workflow
  - keda
maintainers:
  - name: thejens
    url: https://github.com/thejens
