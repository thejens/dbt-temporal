apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dbt-temporal.fullname" . }}
  labels:
    {{- include "dbt-temporal.labels" . | nindent 4 }}
spec:
  {{- if not .Values.keda.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dbt-temporal.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Bring the new worker up before an old one starts draining, so the task
      # queue keeps a poller through the rollout.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        # Env comes from these through envFrom, which does not restart pods by
        # itself: hashing them into the template does.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.dbt.profiles.inline }}
        checksum/profiles: {{ include (print $.Template.BasePath "/secret-profiles.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "dbt-temporal.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "dbt-temporal.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      # On SIGTERM the worker stops polling and drains in-flight activities
      # for WORKER_GRACEFUL_SHUTDOWN_SECS; this must outlast that window.
      terminationGracePeriodSeconds: {{ include "dbt-temporal.terminationGracePeriodSeconds" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "dbt-temporal.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: health
              containerPort: {{ .Values.health.port }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "dbt-temporal.fullname" . }}
            {{- with .Values.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.temporal.apiKey.existingSecret .Values.extraEnv }}
          env:
            {{- if .Values.temporal.apiKey.existingSecret }}
            - name: TEMPORAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.temporal.apiKey.existingSecret }}
                  key: {{ .Values.temporal.apiKey.key }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: {{ .Values.health.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.health.startupProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: {{ .Values.health.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.health.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.health.livenessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/dbt-temporal
            {{- if include "dbt-temporal.profilesSecret" . }}
            - name: profiles
              mountPath: /etc/dbt
              readOnly: true
            {{- end }}
            {{- if .Values.temporal.tls.existingSecret }}
            - name: temporal-tls
              mountPath: /etc/temporal/tls
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            {{- with .Values.tmp.medium }}
            medium: {{ . }}
            {{- end }}
            sizeLimit: {{ .Values.tmp.sizeLimit }}
        - name: cache
          emptyDir:
            sizeLimit: {{ .Values.cache.sizeLimit }}
        {{- with include "dbt-temporal.profilesSecret" . }}
        - name: profiles
          secret:
            secretName: {{ . }}
            items:
              - key: profiles.yml
                path: profiles.yml
        {{- end }}
        {{- with .Values.temporal.tls.existingSecret }}
        - name: temporal-tls
          secret:
            secretName: {{ . }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
