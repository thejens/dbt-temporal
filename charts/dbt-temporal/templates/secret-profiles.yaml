{{- if .Values.dbt.profiles.inline }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dbt-temporal.profilesSecret" . }}
  labels:
    {{- include "dbt-temporal.labels" . | nindent 4 }}
type: Opaque
stringData:
  profiles.yml: |
    {{- .Values.dbt.profiles.inline | nindent 4 }}
{{- end }}
